worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;

    # DNS interno do Docker. O nome cge_web volta a ser resolvido depois
    # que o container é recriado, sem ficar preso no IP anterior.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    map $http_x_forwarded_proto $cge_proto {
        ""      $scheme;
        default $http_x_forwarded_proto;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 25m;

        location /static/ {
            alias /var/www/static/;
        }

        location / {
            set $cge_upstream cge_web;
            proxy_pass http://$cge_upstream:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $cge_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
