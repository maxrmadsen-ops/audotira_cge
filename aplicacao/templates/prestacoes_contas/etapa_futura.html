{% extends "base_autenticado.html" %}
{% block titulo %}{{ etapa.titulo }} · CGE{% endblock %}
{% block conteudo %}
<header class="cabeca-processo">
    <p class="trilho"><a href="{% url 'prestacoes_contas:lista' %}">Processos</a> / {{ prestacao.numero_processo }}</p>
    <h1 class="h3">{{ etapa.titulo }}</h1>
    <p><span class="selo-menu">Etapa futura</span></p>
</header>
<article class="cartao">
    <p>{{ etapa.texto }}</p>
    <p class="mb-0"><a class="btn btn-outline-primary btn-sm" href="{{ url_atual }}">Abrir {{ etapa.destino }}</a></p>
</article>
{% endblock %}
