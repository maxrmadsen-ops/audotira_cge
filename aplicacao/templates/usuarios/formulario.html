{% extends "base_autenticado.html" %}
{% block titulo %}{{ titulo_pagina }} · CGE{% endblock %}
{% block conteudo %}
<nav class="breadcrumb-cge" aria-label="breadcrumb">Administração / Usuários / {{ titulo_pagina }}</nav>
<h1 class="titulo-pagina">{{ titulo_pagina }}</h1>
<form method="post" class="card-cge p-3" style="max-width: 36rem;">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">Salvar</button>
    <a class="btn btn-outline-secondary" href="{% url 'usuarios:lista' %}">Cancelar</a>
</form>
{% endblock %}
